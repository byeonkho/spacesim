name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  pull_request:
    branches: [master]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: cd backend && ./mvnw verify -q

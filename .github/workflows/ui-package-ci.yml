name: UI Package CI

on:
  push:
    branches: [master]
    paths:
      - packages/ui/**
      - .github/workflows/ui-package-ci.yml
  pull_request:
    branches: [master]
    paths:
      - packages/ui/**
      - .github/workflows/ui-package-ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install dependencies
        run: cd packages/ui && npm ci

      - name: Test
        run: cd packages/ui && npm test

      - name: Build package
        run: cd packages/ui && npm run build

      - name: Build Storybook
        run: cd packages/ui && npm run build-storybook
